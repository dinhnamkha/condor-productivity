<style type="text/tailwindcss">
  @layer base {
    html, body { @apply h-full; }
    body { @apply bg-[#F8FAFC] text-slate-800 font-sans antialiased m-0 p-0; }
    button, input, select { font-family: inherit; }

    :root { --ink: #1e293b; --line: #cbd5e1; }
  }

  @layer components {
    /* ================= APP SHELL — Dark Sidebar + Light Canvas ================= */

    .app-shell { @apply flex-1 flex flex-col md:flex-row; }

    /* ---- Sidebar (desktop only) ---- */
    .sidebar { @apply hidden md:flex md:flex-col md:w-64 md:flex-none md:h-screen md:sticky md:top-0 bg-slate-900 text-slate-300; }
    .sidebar-brand { @apply flex items-center gap-3 px-5 py-5 border-b border-white/10; }
    .sidebar-brand .logo { @apply w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white font-extrabold text-sm flex-none shadow-lg shadow-brand-600/30; }
    .brand-titles { @apply min-w-0; }
    .brand-sub { @apply text-[10px] tracking-[0.15em] text-slate-500 uppercase font-bold; }

    .sidebar-nav { @apply flex-1 px-3 py-4 flex flex-col gap-1 overflow-y-auto; }

    .sidebar-profile { @apply flex items-center gap-2.5 px-4 py-4 border-t border-white/10; }

    .profile-logout { @apply flex-none w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-white/10 hover:text-white transition-colors; }
    .profile-logout svg { @apply w-[17px] h-[17px]; }

    /* ---- Mobile top bar (mobile only — desktop uses the sidebar instead) ---- */
    .content-area { @apply flex-1 min-w-0 flex flex-col; }
    .mobile-topbar { @apply flex md:hidden items-center gap-3 bg-slate-900 px-5 py-3.5 sticky top-0 z-20; }
    .mobile-topbar .logo { @apply flex-none w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white font-extrabold text-[13px]; }
    .mobile-topbar .titles { @apply flex-1 min-w-0; }
    .mobile-topbar .line1 { @apply text-[10px] tracking-wider text-slate-500 uppercase font-medium; }
    .mobile-topbar h1 { @apply text-[15px] font-bold text-white truncate m-0 mt-0.5; }
    .mobile-topbar .userbox { @apply text-[11px] text-right text-slate-500 flex-none; }
    .mobile-topbar .userbox b { @apply block text-white text-[12.5px] font-semibold; }

    /* Tu dong an Header khi cuon xuong (chi tren di dong — desktop dung sidebar co dinh, khong bi anh huong

    /* ---- Content header (page title + status pill) ---- */
    .content-header { @apply flex items-center justify-between gap-3 px-5 pt-5 pb-4 md:px-8 md:pt-8 md:pb-6; }

    /* Thanh progress bar 2 mau (Truc tiep/Gian tiep) trong the KPI — reusable cho bat ky ty le 2 phan nao khac neu can. */

    .split-bar-legend .b { @apply text-amber-600; }

    /* ================= Tables ================= */
    .tablewrap { @apply overflow-x-auto -mx-1 px-1; }
    table { @apply w-full border-collapse text-[13px]; }
    th, td { @apply px-4 py-3.5 border-b border-slate-100 text-left whitespace-nowrap; }

    .toolbar { @apply flex flex-wrap gap-2 items-center mb-3; }
    .toolbar input, .toolbar select { @apply w-auto min-h-[40px] px-3 py-2 text-[13.5px]; }
    .search-wrap { @apply relative; }
    .search-wrap input { @apply pl-9; }

    /* ================= Toast ================= */
    .toast {
      @apply fixed bottom-20 right-6 md:bottom-6 bg-slate-900 text-white text-sm font-medium px-4 py-3 rounded-lg shadow-xl border border-slate-800 flex items-center gap-3 opacity-0 pointer-events-none translate-y-2 z-[80];
      transition: opacity .2s, transform .2s;
    }
    .toast.show { @apply opacity-100 translate-y-0; }
    .toast.err { @apply bg-rose-900 border-rose-700; }

    /* ================= Global Loading Bar =================
       Thanh trang thai toan cuc — hien khi co it nhat 1 request mang (apiCall) dang cho phan hoi, de nguoi
       dung LUON thay duoc trang "dang xu ly", khong con cam giac "bam ma khong thay gi" khi mang cham/timeout. */
    #globalLoadingBar {
      @apply fixed top-0 left-0 h-[3px] w-full z-[100] pointer-events-none opacity-0;
      background: linear-gradient(90deg, transparent, #2563eb, transparent);
      background-size: 60% 100%;
      transition: opacity .15s;
    }
    #globalLoadingBar.show { @apply opacity-100; animation: globalLoadingSlide 1.1s ease-in-out infinite; }
    @keyframes globalLoadingSlide { 0%{background-position:-60% 0;} 100%{background-position:160% 0;} }

    /* ================= Modal ================= */
    .modal-overlay { @apply fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-end md:items-center justify-center z-[60] p-0 md:p-4; }
    .modal { @apply bg-white rounded-t-2xl md:rounded-2xl max-w-xl w-full max-h-[88vh] overflow-y-auto p-5 shadow-2xl; }

    /* ================= Bars ================= */

    .floating-bar span { @apply text-sm font-medium text-slate-300; }

    .login-wrap { @apply flex-1 flex items-center justify-center p-5 bg-slate-900; }
    .login-card { @apply max-w-sm w-full bg-white border border-slate-100 rounded-2xl shadow-2xl p-7; }

    .checkline { @apply flex items-center gap-2 text-[13.5px] text-slate-500 my-1 mb-4 font-medium; }

<body>
<div id="globalLoadingBar"></div>
<div id="app"></div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONDOR PRODUCTIVITY — OFFLINE PROTOTYPE
   Data layer: localStorage (key CONDOR_DB_KEY). No network calls
   except the SheetJS CDN script (only needed for Excel import) and
   Google Fonts (best-effort; app works offline without it).
   ============================================================ */

const CONDOR_DB_KEY = 'condor_offline_db_v1';
const CONDOR_SESSION_KEY = 'condor_offline_session_v1';
const BREAKS = [[600,610],[720,780],[900,910],[1020,1035]]; // 10:00-10:10,12:00-13:00,15:00-15:10,17:00-17:15
const OT_START = 1035; // 17:15

/* ---------------- Seed data ---------------- */
function seedDB(){
  return {
    employees:[
      {maNV:'Admin', ten:'Admin', employeeTeam:'', role:'Admin', passwordHash:null, active:true},
    ],
    teams:[],
    workingTeamPermissions:[],
    /* Bảng gộp thay thế Sản phẩm + Process + Thời gian chuẩn + Việc gián tiếp.
       1 dòng = {workType:'Direct'|'Indirect', workingTeam, maTP, tenTP, maNVL, tenNVL, congDoan, thoiGianChuan}.
       Direct: maTP/tenTP bắt buộc; maNVL/tenNVL tuỳ chọn (để phân hoá TGC theo nguyên vật liệu, có thể để trống).
       Indirect: maTP/tenTP/maNVL/tenNVL để trống, chỉ workingTeam+congDoan; thoiGianChuan=0.
       Khoá xác định 1 dòng: workType + workingTeam + maTP + maNVL + congDoan.
       KHÔNG còn lưu lịch sử theo ngày hiệu lực (bỏ effectiveFrom) — mỗi dòng chỉ có đúng 1 TGC hiện hành. */
    workCatalog:[],
    workRecords:[],
    auditLogs:[],
    /* Tổng TG chuẩn theo Mã thành phẩm (gộp mọi công đoạn), theo TỪNG Tổ sản xuất mã đó — dữ liệu THAM KHẢO
       do Admin cung cấp/Import riêng, KHÁC với thoiGianChuan trong workCatalog (vốn là TGC của TỪNG công đoạn
       lẻ). Dùng để tính "TG lý thuyết" trong tab Tổng hợp Tổ. 1 dòng = {maTP, tenTP, workingTeam,
       standardTimeTotal(phút)}. Khoá xác định 1 dòng: workingTeam + maTP. */
    productStandardTimes:[],
    _seedPasswordsPending:true, // set default password = MaNV for seed accounts on first boot
  };
}

let DB = null;
/* Thu tai du lieu khoi tao tu file data.json (chi thanh cong khi mo qua Local Server — VD `python -m http.server`
   hoac VS Code Live Server — vi trinh duyet chan fetch() bang CORS khi mo truc tiep file:// ).
   That bai vi BAT KY LY DO GI (khong co server, thieu file data.json, JSON loi cu phap, sai cau truc...)
   deu tra ve null mot cach im lang — loadDB() se tu dong dung lai seedDB() nhu cu, dam bao file HTML
   van mo truc tiep (double-click) hoat dong binh thuong, khong bat buoc phai co server. */
async function loadSeedFromJSON(){
  try {
    const res = await fetch('data.json');
    if (!res.ok) return null;
    const json = await res.json();
    if (!json || !Array.isArray(json.employees) || !Array.isArray(json.teams)) return null; // sanity check cau truc toi thieu
    return json;
  } catch(err){
    return null; // fetch bi CORS chan tren file://, khong tim thay file, loi mang... deu roi vao day
  }
}
async function loadDB(){
  const raw = localStorage.getItem(CONDOR_DB_KEY);
  if (raw){ DB = JSON.parse(raw); }
  else {
    const seedFromFile = await loadSeedFromJSON();
    DB = seedFromFile || seedDB();
  }
  // Tu phuc hoi neu trinh duyet con cache DB cu (truoc khi gop 4 bang thanh workCatalog) - tranh crash.
  if (!Array.isArray(DB.workCatalog)) DB.workCatalog = [];
  if (!Array.isArray(DB.productStandardTimes)) DB.productStandardTimes = []; // truoc khi co tinh nang Tong hop To
  delete DB.products; delete DB.processes; delete DB.standardTimes; delete DB.indirectWorkTypes;
}
function saveDB(){ localStorage.setItem(CONDOR_DB_KEY, JSON.stringify(DB)); }

async function ensureSeedPasswords(){
  if (!DB._seedPasswordsPending) return;
  for (const e of DB.employees){
    if (!e.passwordHash) e.passwordHash = await sha256(e.maNV);
  }
  DB._seedPasswordsPending = false;
  saveDB();
}

/* ---------------- Utils ---------------- */
function uid(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthStartStr(){ return todayStr().slice(0,7)+'-01'; }
function minToHHMM(m){ const h=Math.floor(m/60)%24, mm=m%60; return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function hhmmToMin(s){ const [h,m]=s.split(':').map(Number); return h*60+m; }
function fmt1(n){ return Math.round(n*10)/10; }
function fmt2(n){ return (Math.round((n||0)*100)/100).toFixed(2); }
/* Doi so PHUT -> chuoi GIO lam tron 1 chu so thap phan (VD 134.6) — dung cho cac KPI hien thi thoi gian. */
function fmtHours(min){ return fmt1((min||0)/60); }
/* Hiển thị Thời gian chuẩn với đúng 3 số thập phân (VD: 0.07 -> "0.070") để không bị hiểu nhầm là 0. */
function fmt3(n){ return Number(n||0).toFixed(3); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function computeTimes(startMin, endMinRaw){
  let end = endMinRaw;
  let crossMidnight = false;
  if (end <= startMin){ end += 1440; crossMidnight = true; }
  const totalTime = end - startMin;
  let breakTime = 0;
  if (!crossMidnight){ // BR-241: no break applied for cross-midnight records
    for (const [bs,be] of BREAKS){
      const overlap = Math.max(0, Math.min(end,be) - Math.max(startMin,bs));
      breakTime += overlap;
    }
  }
  const actualTime = totalTime - breakTime;
  // entirely inside a break?
  let insideBreak = false;
  if (!crossMidnight){
    for (const [bs,be] of BREAKS){ if (startMin>=bs && end<=be){ insideBreak = true; break; } }
  }
  // OT (display-only metric, does not affect productivity denominator)
  let otMinutes = 0;
  if (!crossMidnight && end > OT_START){
    const otRawStart = Math.max(startMin, OT_START);
    let otRaw = end - otRawStart;
    for (const [bs,be] of BREAKS){
      otRaw -= Math.max(0, Math.min(end,be) - Math.max(otRawStart,bs));
    }
    otMinutes = Math.floor(Math.max(0,otRaw)/30)*30; // UI/BR-244 round down to 30-min block
  }
  return { totalTime, breakTime, actualTime, crossMidnight, insideBreak, otMinutes };
}

/* Tính Năng suất theo công thức SUM(TGChuan*SL)/SUM(ActualTime)*100 cho 1 tập Work Record Trực tiếp
   ĐÃ lọc sẵn (loại Rejected) — dùng chung cho cả theo-ngày (dailyProductivity) và theo-khoảng (Dashboard). */

/* Tinh so phut "Giai lao" CHI trong 2 khung 10 phut sang (10:00-10:10) va 10 phut chieu (15:00-15:10) —
   KHONG tinh khung 15 phut luc 17:00-17:15 (theo yeu cau: khung nay khong goi la "Giai lao"). Dung CHINH
   khung BREAKS[0]/BREAKS[2] hien co (khong doi BREAKS, chi doc lai) de dam bao khop tuyet doi voi cach app
   dang tu dong tru Break vao Actual Time — day la ham THUAN HIEN THI cho tab Tong hop To, khong anh huong
   computeTimes()/breakTime/actualTime cua Work Record. */
function computeGiaiLaoMinutes(startMin, endMinRaw){
  let end = endMinRaw;
  if (end <= startMin) return 0; // giong computeTimes(): qua nua dem thi KHONG tinh Break (BR-241), Giai lao cung vay
  const GIAI_LAO_WINDOWS = [BREAKS[0], BREAKS[2]]; // 10:00-10:10 va 15:00-15:10 — bo qua BREAKS[1] (trua) va BREAKS[3] (17h)
  let mins = 0;
  for (const [bs,be] of GIAI_LAO_WINDOWS){
    mins += Math.max(0, Math.min(end,be) - Math.max(startMin,bs));
  }
  return mins;
}

/* ---------------- API dùng chung (Google Sheets qua Apps Script) — GIAI ĐOẠN 1: Nhân viên/Tổ/Đăng nhập ----------------
   Dán "Web app URL" sau khi Deploy Apps Script vào đây. Để trống ("") thì app hoạt động 100% cục bộ như trước,
   không cần server — mọi hàm gọi apiCall() bên dưới sẽ tự nhận biết và dùng lại logic cũ (không đổi hành vi). */
const API_URL = 'https://script.google.com/macros/s/AKfycbz2oq3lzaXoKpjKwXLKuHL7ZusJ7e5sLSGwspFR85LKAQeON40wQ-V8DU1G6Gr4U1Qa/exec';

/* Gọi API Apps Script. Bất kỳ lý do gì khiến request thất bại (chưa deploy, mất mạng, CORS, server lỗi...)
   đều trả về null một cách an toàn — nơi gọi hàm này sẽ tự fallback về chế độ cục bộ (DB.employees/DB.teams
   thao tác trực tiếp trên trình duyệt như trước), không crash.
   LƯU Ý KỸ THUẬT: KHÔNG set header Content-Type:application/json — Apps Script Web App không xử lý tốt
   request "preflight" CORS mà trình duyệt tự thêm khi có header đó. Để fetch() tự dùng text/plain mặc định
   (Apps Script vẫn đọc đúng JSON qua e.postData.contents bất kể Content-Type khai báo là gì) — đây là cách
   né lỗi CORS kinh điển khi gọi Apps Script Web App. */
function sleepMs(ms){ return new Promise(resolve=>setTimeout(resolve, ms)); }
/* THEO DOI TRANG THAI API THAT (khong gia lap) — chi dung de HIEN THI o "System Health" (Admin Control
   Center), KHONG anh huong bat ky logic goi API/queue/rollback nao o duoi. true = lan goi gan nhat CHAM
   DUOC toi Server (du server tra ve ok:true hay ok:false deu la "chua tung ket noi duoc" khac nhau — ok:false
   la loi nghiep vu, van la "Online"); false = that bai ket noi (mat mang/CORS/server loi); null = phien nay
   CHUA tung goi API lan nao, nen KHONG THE xac dinh — hien thi "Không xác định", khong duoc gia lap Online. */
let lastApiOk = null;
/* Neu Server tra ve { busy:true } (LockService het thoi gian cho vi qua nhieu nguoi ghi cung luc — tam thoi,
   KHONG phai bi tu choi that su), tu dong thu lai vai lan truoc khi tra ve cho noi goi — tranh nguoi dung phai
   tu bam lai thu cong hoac (te hon) mat thao tac vi apiCallOrQueue coi day la "bi tu choi", khong dua vao hang doi. */
/* Thanh trang thai toan cuc (globalLoadingBar) — dem so request dang cho (pendingApiCalls) de xu ly dung
   truong hop goi long nhau/thu lai (busy retry o duoi) van khong tat thanh som. Dat o day (khong phai
   trong apiCallOrQueue) de bat duoc CA syncPendingQueue()/syncEmployeesAndTeamsFromAPI() goi apiCall() truc
   tiep, khong chi thao tac ghi qua apiCallOrQueue(). */
let pendingApiCalls = 0;
function updateGlobalLoadingBar(){
  const bar = document.getElementById('globalLoadingBar');
  if (!bar) return;
  if (pendingApiCalls>0) bar.classList.add('show'); else bar.classList.remove('show');
}
async function apiCall(action, payload, _retriesLeft){
  if (!API_URL) return null;
  if (_retriesLeft===undefined) _retriesLeft = 2;
  pendingApiCalls++; updateGlobalLoadingBar();
  try {
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({action}, payload)) });
    if (!res.ok) { lastApiOk = false; return null; }
    const result = await res.json();
    if (result && result.busy && _retriesLeft>0){
      await sleepMs(1200);
      return await apiCall(action, payload, _retriesLeft-1);
    }
    lastApiOk = true; // cham duoc toi Server va nhan duoc JSON hop le (bat ke ok:true/false ve nghiep vu)
    return result;
  } catch(err){
    lastApiOk = false;
    return null;
  } finally {
    pendingApiCalls--; updateGlobalLoadingBar();
  }
}

/* ---------------- Hàng đợi đồng bộ (Sync Queue) ----------------
   Khi 1 thao tác GHI qua API thất bại vì KHÔNG KẾT NỐI ĐƯỢC (mất mạng, API_URL chưa cấu hình, CORS...) —
   KHÁC với bị server từ chối có lý do (sai quyền, trùng khoá...), trường hợp đó thử lại cũng sẽ sai y hệt
   nên KHÔNG đưa vào hàng đợi — ghi lại thao tác đó, tự động gửi lại khi có mạng trở lại (sự kiện 'online'
   của trình duyệt) hoặc khi bấm "Làm mới dữ liệu". Dữ liệu hàng đợi lưu trong localStorage, không mất khi
   tắt trình duyệt giữa chừng lúc đang mất mạng. */
const SYNC_QUEUE_KEY = 'condor_sync_queue_v1';
function getSyncQueue(){
  try { return JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY)) || []; } catch(err){ return []; }
}
function saveSyncQueue(q){ localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(q)); }
function queueForSync(action, payload){
  const q = getSyncQueue();
  q.push({ id: uid(), action, payload, queuedAt: Date.now() });
  saveSyncQueue(q);
}
/* Bọc apiCall() cho MỌI thao tác GHI: nếu apiCall thất bại vì không kết nối được (trả về null) VÀ đã có
   cấu hình API_URL (tức đúng ra phải gọi được, chỉ là tạm thời mất mạng) — tự động đưa vào hàng đợi.
   Trả về y hệt kết quả apiCall (null hoặc {ok,...}) để nơi gọi không cần đổi logic xử lý fallback cục bộ. */
async function apiCallOrQueue(action, payload){
  const result = await apiCall(action, payload);
  if (result===null && API_URL) queueForSync(action, payload);
  return result;
}
/* Gửi lại toàn bộ hàng đợi — gọi khi có mạng trở lại hoặc bấm "Làm mới dữ liệu". Mục đã gửi thành công
   (kể cả bị server từ chối có lý do, VD trùng khoá do đã tự thêm cách khác trong lúc mất mạng) đều được
   loại khỏi hàng đợi — chỉ mục THỰC SỰ chưa gửi được (vẫn mất mạng) mới giữ lại thử tiếp. */
async function syncPendingQueue(){
  if (!API_URL) return { synced:0, remaining:0, rejected:0 };
  const q = getSyncQueue();
  if (!q.length) return { synced:0, remaining:0, rejected:0 };
  let syncedCount = 0, rejectedCount = 0;
  const stillPending = [];
  for (const item of q){
    const result = await apiCall(item.action, item.payload);
    if (result===null){ stillPending.push(item); continue; } // van chua ket noi duoc, giu lai thu tiep
    if (result.ok) syncedCount++; else rejectedCount++; // gui toi Server thanh cong, nhung bi tu choi co ly do (VD het han sua, trung gio)
  }
  saveSyncQueue(stillPending);
  return { synced: syncedCount, remaining: stillPending.length, rejected: rejectedCount };
}
/* Trình duyệt tự báo khi có mạng trở lại — tự động thử gửi hàng đợi ngay lúc đó, không cần đợi người dùng bấm gì. */
window.addEventListener('online', async ()=>{
  const r = await syncPendingQueue();
  if (r.synced>0 || r.rejected>0){
    if (currentSession) await syncEmployeesAndTeamsFromAPI(currentSession);
    let msg = r.synced>0 ? `Đã tự động đồng bộ ${r.synced} thay đổi đang chờ lúc mất mạng.` : '';
    if (r.rejected>0) msg += (msg?' ':'') + `⚠️ ${r.rejected} thay đổi bị từ chối (VD hết hạn sửa, trùng dữ liệu) — vui lòng kiểm tra lại.`;
    showToast(msg, r.rejected>0);
    render();
  }
});

let currentSession = null; // {maNV, remember, loginAt, lastActive, passwordHash}

function loadSession(){
  const raw = localStorage.getItem(CONDOR_SESSION_KEY);
  if (!raw) return null;
  try{
    const s = JSON.parse(raw);
    const now = Date.now();
    const idleExpired = (now - s.lastActive) > 8*3600*1000;
    const rememberExpired = s.remember ? (now - s.loginAt) > 30*24*3600*1000 : true;
    if (idleExpired && (!s.remember || rememberExpired)){ localStorage.removeItem(CONDOR_SESSION_KEY); return null; }
    if (idleExpired && s.remember && !rememberExpired){ s.lastActive = now; localStorage.setItem(CONDOR_SESSION_KEY, JSON.stringify(s)); }
    return s;
  } catch(e){ return null; }
}
function touchSession(){
  if (!currentSession) return;
  currentSession.lastActive = Date.now();
  localStorage.setItem(CONDOR_SESSION_KEY, JSON.stringify(currentSession));

/* ---------------- Biểu đồ Năng suất (Dashboard cá nhân) ---------------- */
function daysInMonth(yyyymm){
  const [y,m] = yyyymm.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
/* Tính dữ liệu cho biểu đồ, đồng bộ theo chế độ lọc hiện tại:
   - Tháng: trục X = từng ngày trong tháng (1..28/29/30/31), Y = Năng suất ngày đó (null nếu không có dữ liệu -> đứt đoạn).
   - Ngày: trục X = từng khung giờ BẮT ĐẦU có Work Record Trực tiếp trong ngày đó (VD 7h, 8h, 9h...), Y = Năng suất gộp trong khung giờ đó. */
function getDashboardChartData(maNV, isMonth, filterValue){
  if (isMonth){
    const totalDays = daysInMonth(filterValue);
    const labels = [], data = [];
    for (let d=1; d<=totalDays; d++){
      const dateStr = filterValue + '-' + String(d).padStart(2,'0');
      labels.push(String(d));
      const dayRows = DB.workRecords.filter(r=> r.maNV===maNV && r.date===dateStr && r.workType==='Direct' && r.status!=='Rejected');
      data.push(dayRows.length ? productivityForRows(dayRows) : null);
    }
    return { labels, data };
  }
  const dayRows = DB.workRecords.filter(r=> r.maNV===maNV && r.date===filterValue && r.workType==='Direct' && r.status!=='Rejected');
  if (!dayRows.length) return { labels: [], data: [] };
  const minH = Math.min(...dayRows.map(r=>Math.floor(r.start/60)));
  const maxH = Math.max(...dayRows.map(r=>{ const end = r.end<=r.start ? r.end+1440 : r.end; return Math.floor(end/60); }));
  const labels = [], data = [];
  for (let h=minH; h<=Math.min(maxH,47); h++){
    labels.push((h%24) + 'h');
    const bucketRows = dayRows.filter(r=> Math.floor(r.start/60)===h);
    data.push(bucketRows.length ? productivityForRows(bucketRows) : null);
  }
  return { labels, data };
}
let dashboardChartInstance = null;
/* Vẽ/Vẽ lại biểu đồ Năng suất — PHẢI huỷ instance cũ trước khi tạo mới, vì #app (chứa <canvas>)
   bị thay thế toàn bộ mỗi lần render(), nếu không huỷ Chart.js sẽ báo lỗi "Canvas already in use". */
function initDashboardChart(retryCount){
  retryCount = retryCount || 0;
  const canvas = document.getElementById('dashboardProductivityChart');
  if (!canvas) return; // khong phai trang Dashboard, khong lam gi
  if (typeof Chart==='undefined'){
    // Co the CDN chinh (cdnjs) that bai va dang cho CDN du phong (jsdelivr) tai xong - thu lai vai lan truoc khi bao loi that su.
    if (retryCount < 5){ setTimeout(()=>initDashboardChart(retryCount+1), 600); return; }
    canvas.parentElement.innerHTML = '<div class="empty" style="padding:30px;">⚠️ Không tải được thư viện biểu đồ (Chart.js) — cần kết nối Internet ở lần mở đầu tiên. Các phần khác của ứng dụng (KPI, bảng, nhập liệu...) vẫn hoạt động bình thường không cần mạng. Kiểm tra kết nối rồi tải lại trang.</div>';
    return;
  }
  if (dashboardChartInstance){ dashboardChartInstance.destroy(); dashboardChartInstance = null; }
  const u = currentUser();
  const isMonth = dashboardMode==='month';
  const filterValue = isMonth ? dashboardMonthValue : dashboardDayValue;
  const { labels, data } = getDashboardChartData(u.maNV, isMonth, filterValue);
  try {
    dashboardChartInstance = new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{
        label: 'Năng suất (%)', data,
        borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.08)',
        borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#2563eb',
        tension: 0.3, spanGaps: false, fill: true,
      }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display:false } },
        scales: {
          y: { beginAtZero:true, ticks:{ callback:v=>v+'%' } },
          x: { grid:{ display:false } },
        }
      }
    });
  } catch(err){
    canvas.parentElement.innerHTML = '<div class="empty" style="padding:30px;">⚠️ Lỗi khi vẽ biểu đồ: '+esc(err.message)+'</div>';
  }
}

let adminDashboardChartInstance = null;
/* Biểu đồ tròn (doughnut) tỷ lệ Direct/Indirect Time toàn nhà máy cho Admin Dashboard — CÙNG nguyên tắc với
   initDashboardChart() ở trên: chỉ hoạt động khi đang ở trang Admin Dashboard (#adminDashboardChart tồn tại),
   PHẢI huỷ instance cũ trước khi tạo mới vì #app bị thay thế toàn bộ mỗi lần render(). Được gọi vô điều kiện
   từ attachShellEvents() giống hệt initDashboardChart() — tự no-op nếu không phải trang này. */
function initAdminDashboardChart(retryCount){
  retryCount = retryCount || 0;
  const canvas = document.getElementById('adminDashboardChart');

}

/* ---------------- Views: ADMIN CONTROL CENTER ---------------- */
/* Tổng hợp số liệu TOÀN HỆ THỐNG (ALL-TIME, không lọc theo Tháng/Ngày) cho Admin Control Center — đúng vai
   trò "System Control Center" (khác hẳn Dashboard cá nhân theo kỳ của Employee/Leader). Tách hàm riêng để
   cả viewAdminDashboard() (vẽ số liệu) và initAdminDashboardChart() (vẽ biểu đồ) lấy từ ĐÚNG 1 NGUỒN. Rejected
   vẫn được ĐẾM ở đây (Data Status cần biết cả Rejected) nhưng KHÔNG được tính vào Năng suất (dùng
   productivityForRows() đã tự loại Rejected — khớp quy ước toàn hệ thống). */
function getAdminSystemStats(){
  const employees = DB.employees.filter(e=>e.role!=='Admin');
  const teams = DB.teams;
  const workRecords = DB.workRecords;
  const approvedCount = workRecords.filter(r=>r.status==='Approved').length;
  const pendingCount = workRecords.filter(r=>r.status==='Pending').length;
  const rejectedCount = workRecords.filter(r=>r.status==='Rejected').length;
  return { employees, teams, workRecords, approvedCount, pendingCount, rejectedCount };
}
/* Bảng "Team Productivity Overview" — mỗi dòng 1 Tổ, Năng suất BẮT BUỘC dùng công thức gộp
   productivityForRows() (SUM(TGChuan*SL)/SUM(ActualTime)*100), KHÔNG dùng trung bình cộng. */
function getAdminTeamOverviewRows(){
  const today = todayStr();
  return DB.teams.map(t=>{
    const roster = DB.employees.filter(e=> e.role!=='Admin' && e.employeeTeam===t.name);
    const todaySubmitted = new Set(DB.workRecords.filter(r=> r.workingTeam===t.name && r.date===today).map(r=>r.maNV));
    const submitted = roster.filter(e=>todaySubmitted.has(e.maNV)).length;
    const teamDirectRows = DB.workRecords.filter(r=> r.workingTeam===t.name && r.workType==='Direct' && r.status!=='Rejected');
    const productivity = productivityForRows(teamDirectRows);
    const pending = DB.workRecords.filter(r=> r.workingTeam===t.name && r.status==='Pending').length;
    return { name: t.name, employeeCount: roster.length, submitted, missing: roster.length-submitted, productivity, pending };
  });
}
/* Data Quality — chỉ hiển thị vấn đề THẬT trên dữ liệu hiện có, không bao giờ bịa số. "Duplicate Records":
   nhóm theo maNV+ngày+giờ bắt đầu/kết thúc+Tổ làm việc+công đoạn+mã TP — nhiều hơn 1 bản ghi trùng hệt các
   trường này (thường do Import lặp) được tính là dư thừa. Đây CHỈ là số liệu hiển thị (read-only), không tự
   động sửa/xoá gì — khớp nguyên tắc "phát hiện lỗi thì báo, không tự sửa" của nhiệm vụ. */
function getAdminDataQuality(){
  const now = Date.now();
  const missingStdTime = DB.workRecords.filter(r=>r.needsStandardTime).length;
  const groups = {};
  DB.workRecords.forEach(r=>{
    const key = [r.maNV,r.date,r.start,r.end,r.workingTeam,r.congDoan,r.maTP].join('|');
    groups[key] = (groups[key]||0)+1;
  });
  let duplicateRecords = 0;
  Object.values(groups).forEach(c=>{ if (c>1) duplicateRecords += (c-1); });
  const employeesWithoutTeam = DB.employees.filter(e=> e.role!=='Admin' && !e.employeeTeam).length;
  const pendingOver24h = DB.workRecords.filter(r=> r.status==='Pending' && r.createdAt && (now-r.createdAt) > 24*3600*1000).length;
  return { missingStdTime, duplicateRecords, employeesWithoutTeam, pendingOver24h };
}

  const stats = getAdminSystemStats();
  const teamRows = getAdminTeamOverviewRows();
  const dq = getAdminDataQuality();
  const dqIssues = [];
  if (dq.missingStdTime>0) dqIssues.push(`⚠ Thiếu Thời gian chuẩn: ${dq.missingStdTime}`);
  if (dq.duplicateRecords>0) dqIssues.push(`⚠ Bản ghi trùng lặp: ${dq.duplicateRecords}`);
  if (dq.employeesWithoutTeam>0) dqIssues.push(`⚠ Nhân viên chưa có Tổ: ${dq.employeesWithoutTeam}`);
  if (dq.pendingOver24h>0) dqIssues.push(`⚠ Chờ duyệt quá 24 giờ: ${dq.pendingOver24h}`);

/**
 * Component bảng Work Record dùng chung (Reusable) — tự lọc theo Tháng + Tìm kiếm, tự phân trang,
 * tự sắp xếp (nếu bật), rồi mới render các <tr>. Dùng chung cho Lịch sử cá nhân (viewHistory) và
 * Tất cả Work Record (viewAdminRecords) — đảm bảo 2 trang có cùng 1 hành vi lọc/tìm/phân trang.
 *
 * @param {Array}  allRows  Toàn bộ Work Record CHƯA lọc — hàm tự lọc bên trong theo state toàn cục
 *                          (recordMonthFilter, recordSearch, recordPage, recordPageSize, recordSort).
 * @param {Object} config   Tuỳ chọn hiển thị (tất cả optional):
 *   withEdit          bool  Hiện nút "Sửa" — dùng cho Lịch sử cá nhân (chỉ sửa được bản ghi của
 *                            chính người đang đăng nhập, và chưa bị khoá 24h / hoặc đang Rejected).
 *   withAdminActions  bool  Hiện nút "Log" + "Xóa" — dùng cho Tất cả Work Record (Admin).
 *   showToolbar       bool  Có hiện toolbar Tháng/Tìm kiếm + thanh phân trang hay không.
 *                            Mặc định true. Tắt cho Dashboard/Team Dashboard (dữ liệu đã tự nhỏ gọn
 *                            theo ngày/khoảng ngày riêng của các trang đó, không cần thêm lớp lọc).
 *   withMonthFilter   bool  Trong toolbar có ô chọn Tháng hay không. Mặc định = showToolbar.
 *   sortable          bool  Cho phép bấm tiêu đề cột để sắp xếp. Mặc định false (giữ thứ tự mới nhất
 *                            trước). Bật cho Tất cả Work Record (Admin) để giữ đúng khả năng cũ.
 * @returns {string} HTML (toolbar + bảng + phân trang), gồm cả trạng thái rỗng nếu không có dữ liệu.
 */
function renderRecordTable(allRows, config){
  config = config || {};
  const showToolbar = config.showToolbar !== false;
  const withMonthFilter = config.withMonthFilter !== undefined ? config.withMonthFilter : showToolbar;
  const withSearch = config.withSearch !== undefined ? config.withSearch : showToolbar;
  const withEdit = !!config.withEdit;
  const withAdminActions = !!config.withAdminActions;
  const sortable = !!config.sortable;
  // FIX HIEU NANG: phan trang truoc day chi bat khi showToolbar=true, nen cac trang tat showToolbar (Dashboard
  // ca nhan, Team Dashboard) render TOAN BO ban ghi khong phan trang — voi du lieu that (hang nghin dong) gay
  // giat/lag khi keo/cuon do DOM qua lon. Tach rieng withPagination khoi showToolbar de cac trang nay van AN
  // duoc thanh cong cu Thang/Tim kiem (dung bo loc rieng cua trang) nhung VAN duoc phan trang ngam.
  const withPagination = config.withPagination !== undefined ? config.withPagination : showToolbar;
  // 3 bo loc moi theo yeu cau: To lam viec / Ma NV / Ma san pham — moi bo loc BAT DOC LAP voi showToolbar,
  // de cac trang da co bo loc rieng (VD Team Dashboard co san khoang Ngay) van bat duoc rieng le.
  const withTeamFilter = !!config.withTeamFilter;
  const withEmployeeFilter = !!config.withEmployeeFilter;
  const withProductFilter = !!config.withProductFilter;
  const showFilterBar = showToolbar || withTeamFilter || withEmployeeFilter || withProductFilter;

  // ---- 1) Lọc theo Tháng (nếu bật) ----
  let rows = allRows.slice();
  if (withMonthFilter && recordMonthFilter){
    rows = rows.filter(r => r.date.startsWith(recordMonthFilter));
  }

  // ---- 2) Lọc theo Tìm kiếm tự do: Mã NV / Tên / Mã TP / Công đoạn (kể cả Việc gián tiếp) ----
  if (withSearch && recordSearch){
    const q = recordSearch.toLowerCase();
    rows = rows.filter(r =>
      r.maNV.toLowerCase().includes(q) || r.ten.toLowerCase().includes(q) ||
      (r.maTP||'').toLowerCase().includes(q) || (r.congDoan||r.indirectType||'').toLowerCase().includes(q)
    );
  }

  // ---- 2b) 3 bộ lọc chọn nhanh: Tổ / Mã NV / Mã sản phẩm ----
  if (withTeamFilter && recordTeamFilter) rows = rows.filter(r => r.workingTeam===recordTeamFilter);
  if (withEmployeeFilter && recordEmployeeFilter) rows = rows.filter(r => r.maNV===recordEmployeeFilter);
  if (withProductFilter && recordProductFilter) rows = rows.filter(r => r.maTP===recordProductFilter);

  // ---- 3) Sắp xếp: theo cột nếu sortable, ngược lại mặc định mới nhất trước ----
  if (sortable){
    rows.sort((a,b) => {
      const k = recordSort.key;
      let av = a[k], bv = b[k];
      if (typeof av==='string') return recordSort.dir*av.localeCompare(bv);
      return recordSort.dir*((av||0)-(bv||0));
    });
  } else {
    rows.sort((a,b) => (b.date+String(b.start)).localeCompare(a.date+String(a.start)));
  }

  // ---- 4) Phân trang (độc lập với showToolbar — xem ghi chú withPagination ở trên) ----
  const totalFiltered = rows.length;
  let pageRows = rows;
  let totalPages = 1;
  if (withPagination){
    totalPages = Math.max(1, Math.ceil(totalFiltered/recordPageSize));

      ${withSearch ? `<div class="search-wrap">

  // ---- 6) Bảng dữ liệu ----
  const th = (key,label) => sortable

  </tr></thead><tbody>
  ${pageRows.map(r=>{

      <td>${r.workType==='Direct'?fmt3(r.thoiGianChuan):'—'}${r.needsStandardTime?' <span class="pill amber">Thiếu TGC</span>':''}</td><td>${r.quantity}</td>
      <td>${minToHHMM(r.start)}</td><td>${minToHHMM(r.end)}</td>

      ${withAdminActions?`<td style="white-space:nowrap;">

        <button class="btn btn-danger btn-sm" data-action="deleteRecord" data-id="${r.id}">Xóa</button>
      </td>`:''}
    </tr>`;
  }).join('')}
  </tbody></table></div>` : '<div class="empty">Chưa có dữ liệu</div>';

  // ---- 7) Thanh phân trang (độc lập với showToolbar — xem withPagination) ----
  const paginationHtml = (withPagination && totalFiltered>0) ? `
    <div class="toolbar" style="margin-top:12px;justify-content:space-between;">
      <div style="display:flex;gap:8px;align-items:center;">
        <label style="margin:0;font-size:13px;">Số dòng/trang:</label>
        <select id="recordPageSizeSelect">

          <option value="200" ${recordPageSize===200?'selected':''}>200</option>
        </select>

      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-outline btn-sm" data-action="recordPrevPage" ${recordPage<=1?'disabled':''}>← Trước</button>
        <span style="font-size:13px;color:var(--ink-soft);">Trang ${recordPage}/${totalPages}</span>
        <button class="btn btn-outline btn-sm" data-action="recordNextPage" ${recordPage>=totalPages?'disabled':''}>Sau →</button>
      </div>
    </div>` : '';

  return toolbarHtml + tableHtml + paginationHtml;
}

/* Team mà 1 Leader thực sự quản lý (Team.leaderMaNV) — dùng để scope Duyệt/Dashboard theo WORKING TEAM của

/* ---------------- Views: TEAM DASHBOARD (Leader) ---------------- */
/* Quy đổi 1 preset khoảng thời gian ('today'|'week'|'month') thành {from,to} — 'custom' trả về null (giữ
   nguyên window._tdFrom/_tdTo hiện tại do người dùng tự chọn qua 2 ô ngày). */
function teamDashPeriodRange(preset){
  const today = todayStr();
  if (preset==='today') return { from: today, to: today };
  if (preset==='week'){
    const d = new Date(today+'T00:00:00');
    const day = d.getDay(); // 0=Chu nhat
    const diffToMon = (day===0?6:day-1);
    const mon = new Date(d); mon.setDate(d.getDate()-diffToMon);
    return { from: mon.toISOString().slice(0,10), to: today };
  }
  if (preset==='month') return { from: monthStartStr(), to: today };
  return null;
}
/* Dữ liệu cho biểu đồ "Biến động Năng suất Tổ theo Ngày" — mỗi điểm dùng ĐÚNG công thức gộp
   productivityForRows() (SUM(TGChuan*SL)/SUM(ActualTime)*100) cho từng ngày trong khoảng lọc, KHÔNG bao
   giờ trả về 0 cho ngày không có dữ liệu (trả null để Chart.js vẽ đứt đoạn — spanGaps:false). Giới hạn tối
   đa 62 điểm để tránh biểu đồ quá dài khi Leader chọn khoảng thời gian rất rộng. */
function getTeamProductivityTrendData(scope, fromStr, toStr){
  const labels = [], data = [], ref100 = [];
  let d = new Date(fromStr+'T00:00:00');
  const end = new Date(toStr+'T00:00:00');
  let guard = 0;
  while (d<=end && guard<62){
    const dateStr = d.toISOString().slice(0,10);
    labels.push(dateStr.slice(5));
    const dayRows = DB.workRecords.filter(r=> (scope? r.workingTeam===scope : true) && r.date===dateStr && r.workType==='Direct' && r.status!=='Rejected');
    data.push(dayRows.length ? productivityForRows(dayRows) : null);
    ref100.push(100);
    d.setDate(d.getDate()+1);
    guard++;
  }
  return { labels, data, ref100 };
}
let teamProductivityChartInstance = null;
/* Cùng nguyên tắc vòng đời với initDashboardChart()/initAdminDashboardChart() — huỷ instance cũ trước khi vẽ
   lại, tự no-op nếu không ở trang Team Dashboard (#teamProductivityChart không tồn tại). */
function initTeamProductivityChart(retryCount){
  retryCount = retryCount || 0;
  const canvas = document.getElementById('teamProductivityChart');
  if (!canvas) return;
  if (typeof Chart==='undefined'){
    if (retryCount < 5){ setTimeout(()=>initTeamProductivityChart(retryCount+1), 600); return; }
    canvas.parentElement.innerHTML = '<div class="empty" style="padding:30px;">⚠️ Không tải được thư viện biểu đồ (Chart.js).</div>';
    return;
  }
  if (teamProductivityChartInstance){ teamProductivityChartInstance.destroy(); teamProductivityChartInstance = null; }
  const u = currentUser();
  const scope = u.role==='Admin' ? null : teamLedBy(u.maNV);
  const from = window._tdFrom || monthStartStr(), to = window._tdTo || todayStr();
  const { labels, data, ref100 } = getTeamProductivityTrendData(scope, from, to);
  try {
    teamProductivityChartInstance = new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [
        { label:'Năng suất Tổ (%)', data, borderColor:'#2563eb', backgroundColor:'rgba(37,99,235,0.08)', borderWidth:2, pointRadius:3, pointBackgroundColor:'#2563eb', tension:0.3, spanGaps:false, fill:true },
        { label:'Mục tiêu 100%', data: ref100, borderColor:'#cbd5e1', borderWidth:1.5, borderDash:[6,4], pointRadius:0, fill:false },
      ] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display:true, labels:{ boxWidth:12, font:{size:11} } } },
        scales: { y: { beginAtZero:true, ticks:{ callback:v=>v+'%' } }, x: { grid:{ display:false } } }
      }
    });
  } catch(err){
    canvas.parentElement.innerHTML = '<div class="empty" style="padding:30px;">⚠️ Lỗi khi vẽ biểu đồ: '+esc(err.message)+'</div>';
  }
}
function viewTeamDash(){
  const u = currentUser();
  const isAdmin = u.role==='Admin';
  const scope = isAdmin ? null : teamLedBy(u.maNV);
  // Mac dinh xem tu DAU THANG hien tai den hom nay (khong phai chi 1 minh hom nay) — de vua vao Tab da co du
  // lieu ngay, khong bi hieu lam la "chua lam" chi vi hom nay chua nhap gi.
  window._tdPreset = window._tdPreset || 'month';
  window._tdFrom = window._tdFrom || monthStartStr();
  window._tdTo = window._tdTo || todayStr();
  const today = todayStr();

  const rows = DB.workRecords.filter(r=>{
    if (scope && r.workingTeam!==scope) return false;
    return r.date >= window._tdFrom && r.date <= window._tdTo;
  });

  // Rejected không tính vào KPI/Productivity (khớp quy ước của dailyProductivity()) — nhưng vẫn hiển thị
  // đầy đủ (kể cả Rejected) ở bảng "Chi tiết Work Record" bên dưới để Leader thấy được cần theo dõi gì.
  const kpiRows = rows.filter(r=>r.status!=='Rejected');
  const directKpiRows = kpiRows.filter(r=>r.workType==='Direct');

  // Năng suất Tổ — BẮT BUỘC dùng công thức gộp productivityForRows() = SUM(TGChuan*SL)/SUM(ActualTime)*100
  // trên toàn bộ Work Record Trực tiếp trong khoảng đang lọc, KHÔNG dùng trung bình cộng năng suất từng
  // người (đã thay cho cách tính "avg" cũ, theo đúng yêu cầu thiết kế: xem ghi chú BUSINESS LOGIC bên dưới).
  const teamProductivity = productivityForRows(directKpiRows);

  // Nhân viên trong phạm vi (theo Tổ chính - employeeTeam), không tính tài khoản Admin — dùng cho 3 KPI
  // "Nhân viên trong Tổ / Đã nộp / Chưa nộp". Riêng Data Entry & Missing Entry tính theo NGÀY HÔM NAY
  // (không theo khoảng bộ lọc), để Leader luôn biết ngay hôm nay ai đã/chưa nộp bất kể đang xem báo cáo
  // khoảng thời gian nào khác.
  const teamRoster = DB.employees.filter(e=> e.role!=='Admin' && (scope? e.employeeTeam===scope : true));
  const todayRows = DB.workRecords.filter(r=> (scope? r.workingTeam===scope : true) && r.date===today);
  const submittedMaNVToday = new Set(todayRows.map(r=>r.maNV));
  const missingEmployees = teamRoster.filter(e=> !submittedMaNVToday.has(e.maNV));

  // Hiệu suất theo nhân viên (Employee Performance) — gộp theo nhân viên trong khoảng đang lọc.
  const byEmp = {};
  directKpiRows.forEach(r=>{
    const key = r.maNV;
    if (!byEmp[key]) byEmp[key] = {maNV:r.maNV, ten:r.ten, stdMin:0, actual:0, qty:0};
    byEmp[key].stdMin += r.thoiGianChuan*r.quantity;
    byEmp[key].actual += r.actualTime;
    byEmp[key].qty += r.quantity;
  });
  const empRows = Object.values(byEmp).map(e=>({...e, prod: e.actual>0? fmt1(e.stdMin/e.actual*100) : null}));
  empRows.sort((a,b)=> (b.prod??-1)-(a.prod??-1));

  // Chờ duyệt — ALL-TIME theo đúng phạm vi Tổ (khớp viewApprove()), không giới hạn theo bộ lọc ngày ở trên,
  // vì đây là việc Leader cần xử lý ngay bất kể đang xem khoảng thời gian nào.
  const pendingCount = DB.workRecords.filter(r=> r.status==='Pending' && (scope? r.workingTeam===scope : true)).length;

  return renderShell(`
    <div class="section-title" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;">
      <span>TỔ: ${esc(scope||'TẤT CẢ')} · ${esc(roleLabel(u.role).toUpperCase())}: ${esc(u.ten)}</span>

    <div class="toolbar">
      <div class="btnlist" style="gap:6px;">
        <button data-action="tdSetPreset" data-val="today" class="${window._tdPreset==='today'?'active':''}" style="min-height:38px;padding:8px 14px;">Hôm nay</button>
        <button data-action="tdSetPreset" data-val="week" class="${window._tdPreset==='week'?'active':''}" style="min-height:38px;padding:8px 14px;">Tuần này</button>
        <button data-action="tdSetPreset" data-val="month" class="${window._tdPreset==='month'?'active':''}" style="min-height:38px;padding:8px 14px;">Tháng này</button>
        <button data-action="tdSetPreset" data-val="custom" class="${window._tdPreset==='custom'?'active':''}" style="min-height:38px;padding:8px 14px;">Tùy chọn</button>
      </div>
      ${window._tdPreset==='custom' ? `
      <label style="margin:0;">Từ:</label><input type="date" id="tdFrom" value="${window._tdFrom}">
      <label style="margin:0;">Đến:</label><input type="date" id="tdTo" value="${window._tdTo}">
      <button class="btn btn-outline btn-sm" data-action="applyTeamDash">Lọc</button>` : ''}
      <button class="btn btn-outline btn-sm" data-action="exportTeamRecords">Xuất Excel (.csv)</button>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="kpi-icon-row"><div class="kpi-icon-box blue">${kpiIcon('split')}</div>
        <div><div class="l">Nhân viên trong Tổ</div><div class="v">${teamRoster.length}</div></div></div></div>
      <div class="kpi"><div class="kpi-icon-row"><div class="kpi-icon-box emerald">${kpiIcon('box')}</div>
        <div><div class="l">Đã nộp dữ liệu (hôm nay)</div><div class="v">${submittedMaNVToday.size} / ${teamRoster.length}</div></div></div></div>
      <div class="kpi"><div class="kpi-icon-row"><div class="kpi-icon-box amber">${kpiIcon('alert')}</div>

      <div class="kpi"><div class="kpi-icon-row"><div class="kpi-icon-box violet">${kpiIcon('target')}</div>
        <div><div class="l">Năng suất Tổ</div><div class="v">${teamProductivity!==null?teamProductivity+'%':'—'}</div></div></div></div>
    </div>

/* ---------------- Views: TỔNG HỢP TỔ (Leader/Admin) ----------------
   Bảng THAM KHẢO — KHÔNG ghi vào DB, chỉ đọc/gộp lại DB.workRecords hiện có + DB.productStandardTimes (Admin
   cung cấp) để giúp Tổ trưởng đỡ phải tự tính thời gian. Số lượng ở đây KHÔNG phải số liệu chính thức — Leader
   vẫn phải đối chiếu với số nhập kho trong ngày trước khi nhập vào bảng riêng của họ. */
/* Quy doi 1 preset ('today'|'week'|'month') thanh {from,to} — dung chung logic voi teamDashPeriodRange(),
   nhung tach rieng ham/state (window._ts*) de khong dung do voi bo loc cua tab "Thống kê Tổ" (window._td*). */
function teamSummaryPeriodRange(preset){ return teamDashPeriodRange(preset); }
function buildTeamSummaryRows(scope, fromStr, toStr){
  const rows = [];
  const lentOut = [];
  let giaiLaoTotal = 0;
  // Dung Date.UTC() (khong qua "new Date(fromStr+'T00:00:00')" roi doi lai bang toISOString()) de tranh loi
  // lech 1 ngay do timezone dia phuong (vd UTC+7 tai VN: "T00:00:00" bi hieu la 00:00 gio dia phuong, doi
  // sang UTC lai lui ve ngay hom truoc) — day la loi da co san o mot vai noi khac trong app (vd
  // teamDashPeriodRange/getTeamProductivityTrendData), nhung KHONG sua o day de tranh anh huong pham vi ngoai
  // tinh nang nay; ham MOI nay tu dung UTC nhat quan tu dau den cuoi de khong bi loi tuong tu.
  let d = new Date(Date.UTC(...fromStr.split('-').map(Number).map((n,i)=> i===1?n-1:n)));
  const end = new Date(Date.UTC(...toStr.split('-').map(Number).map((n,i)=> i===1?n-1:n)));
  let guard = 0;
  while (d<=end && guard<93){
    const dateStr = d.toISOString().slice(0,10);
    const dayRows = DB.workRecords.filter(r=> r.workingTeam===scope && r.date===dateStr && r.status!=='Rejected');
    let giaiLaoMin = 0;
    dayRows.forEach(r=>{ giaiLaoMin += computeGiaiLaoMinutes(r.start, r.end); });
    giaiLaoTotal += giaiLaoMin;
    // ---- Trực tiếp: gộp theo Mã TP ----
    const directByMaTP = {};
    dayRows.filter(r=>r.workType==='Direct').forEach(r=>{
      const key = r.maTP;
      if (!directByMaTP[key]) directByMaTP[key] = { maTP:r.maTP, tenTP:r.tenTP, qty:0, actual:0, supportActual:0, supportTeams:new Set() };
      const g = directByMaTP[key];
      g.qty += r.quantity; g.actual += r.actualTime;
      const homeTeam = employeeTeamOf(r.maNV);
      if (homeTeam && homeTeam!==scope){ g.supportActual += r.actualTime; g.supportTeams.add(homeTeam); }
      if (!g.tenTP && r.tenTP) g.tenTP = r.tenTP;
    });
    Object.values(directByMaTP).forEach(g=>{
      const stdMin = getProductStdTime(g.maTP, scope);
      const stdHour = stdMin!==null ? stdMin/60 : null;
      const theoreticalHour = stdMin!==null ? (stdMin*g.qty)/60 : null;
      const laborHour = g.actual/60;
      const prod = (stdMin!==null && g.actual>0) ? fmt1((stdMin*g.qty)/g.actual*100) : null;
      rows.push({ date: dateStr, workType:'Direct', maTP:g.maTP, tenTP:g.tenTP||'', congDoanLabel:'Trực tiếp',
        qty:g.qty, stdHour, theoreticalHour, laborHour,
        supportDirectHour: g.supportActual/60, supportIndirectHour: 0,
        supportTeams: [...g.supportTeams], productivity: prod,
        note: stdMin===null ? 'Chưa có TG chuẩn' : '' });
    });
    // ---- Gián tiếp: gộp theo indirectType (kể cả Giải lao — tính riêng bên dưới) ----
    const indirectByType = {};
    dayRows.filter(r=>r.workType==='Indirect').forEach(r=>{
      const key = r.indirectType||'(Không rõ)';
      if (!indirectByType[key]) indirectByType[key] = { indirectType:key, actual:0, supportActual:0, supportTeams:new Set() };
      const g = indirectByType[key];
      g.actual += r.actualTime;
      const homeTeam = employeeTeamOf(r.maNV);
      if (homeTeam && homeTeam!==scope){ g.supportActual += r.actualTime; g.supportTeams.add(homeTeam); }
    });
    Object.values(indirectByType).forEach(g=>{
      rows.push({ date: dateStr, workType:'Indirect', maTP:'', tenTP:'', congDoanLabel:g.indirectType,
        qty:0, stdHour:null, theoreticalHour:null, laborHour:g.actual/60,
        supportDirectHour:0, supportIndirectHour:g.supportActual/60,
        supportTeams:[...g.supportTeams], productivity:null, note:'' });
    });
    if (giaiLaoMin>0){
      rows.push({ date: dateStr, workType:'Indirect', maTP:'', tenTP:'', congDoanLabel:'Giải lao/休憩',
        qty:0, stdHour:null, theoreticalHour:null, laborHour:giaiLaoMin/60,
        supportDirectHour:0, supportIndirectHour:0, supportTeams:[], productivity:null, note:'' });
    }
    // ---- Đã cho Tổ khác mượn người (nhân viên chính của Tổ này, đi làm ở Tổ khác trong ngày) ----
    const lentDay = DB.workRecords.filter(r=> r.date===dateStr && r.status!=='Rejected' && r.workingTeam!==scope && employeeTeamOf(r.maNV)===scope);
    const lentByTeam = {};
    lentDay.forEach(r=>{
      const key = r.workingTeam;
      if (!lentByTeam[key]) lentByTeam[key] = { team:key, actual:0, maTPs:new Set() };
      lentByTeam[key].actual += r.actualTime;
      if (r.workType==='Direct' && r.maTP) lentByTeam[key].maTPs.add(r.maTP); else if (r.workType==='Indirect' && r.indirectType) lentByTeam[key].maTPs.add(r.indirectType);
    });
    Object.values(lentByTeam).forEach(x=> lentOut.push({ date:dateStr, team:x.team, hours:x.actual/60, items:[...x.maTPs].join(', ') }));
    d.setUTCDate(d.getUTCDate()+1);
    guard++;
  }
  rows.sort((a,b)=> a.date===b.date ? 0 : (a.date<b.date?-1:1));

  // ---- Tong cong ca khoang thoi gian dang xem (dung cho o Tong SL/TG dau bang + dong TONG cuoi bang) ----
  // Nang suat Tổ tong hop (overallProductivity): CHI gop cac dong Truc tiep DA CO TG chuan (bo qua dong thieu
  // TG chuan o CA tu so lan mau so, thay vi coi thieu = 0) — de khong lam sai lech ty le, dung nguyen tac
  // "SUM(TG ly thuyet)/SUM(TG nhan cong)*100" nhu cong thuc productivityForRows() hien co nhung tren du lieu
  // cua bang nay (TG chuan Tong theo Ma TP, khac voi TG chuan tung cong doan).
  let totalQty = 0, totalLaborHour = 0, totalTheoreticalHour = 0, missingStdCount = 0;
  let prodNumerator = 0, prodDenominator = 0;
  rows.forEach(r=>{
    totalLaborHour += r.laborHour;
    if (r.workType==='Direct'){
      totalQty += r.qty;
      if (r.stdHour===null) missingStdCount++;
      else {
        totalTheoreticalHour += r.theoreticalHour;
        if (r.laborHour>0){ prodNumerator += r.theoreticalHour; prodDenominator += r.laborHour; }
      }
    }
  });
  const overallProductivity = prodDenominator>0 ? fmt1(prodNumerator/prodDenominator*100) : null;

  return { rows, lentOut, giaiLaoTotalHour: giaiLaoTotal/60,
    totalQty, totalLaborHour, totalTheoreticalHour, overallProductivity, missingStdCount };
}

}

   Khác Import (ghi đè toàn bộ): thêm thủ công chỉ APPEND 1 dòng, có kiểm tra trùng khóa chính để tránh dữ liệu đôi. */
/* ---------------- Bulk Import Work Record (Team/Tổ tab) ----------------
   Khác Master Data import: đây là import DỮ LIỆU GIAO DỊCH (Work Record), không ghi đè — chỉ THÊM,
   và mỗi dòng phải qua đúng validation như submitEntry() (quyền Tổ, overlap, Break, Standard Time...). */
function excelCellToDateStr(v){
  if (v instanceof Date) return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  const s = String(v==null?'':v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return s;
}
/* Chi kiem tra dinh dang yyyy-mm-dd bang regex la chua du — "2026-02-30" van khop regex nhung khong
   phai ngay co that tren lich. Parse lai thanh Date roi doi nguoc ve chuoi, neu lech di (Date tu "tran"
   thang/nam) tuc la ngay khong hop le. */
function isRealCalendarDate(dateStr){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return false;
  const d = new Date(dateStr+'T00:00:00');
  if (isNaN(d.getTime())) return false;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') === dateStr;
}
function excelCellToHHMM(v){
  if (v instanceof Date) return String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0');
  if (typeof v==='number' && v>=0 && v<1){
    const totalMin = Math.round(v*24*60);
    return String(Math.floor(totalMin/60)).padStart(2,'0')+':'+String(totalMin%60).padStart(2,'0');
  }
  return String(v==null?'':v).trim();
}
function validateWorkRecordRows(rows){
  const u = currentUser();
  const scope = u.role==='Admin' ? null : teamLedBy(u.maNV);
  const batchByPerson = {};
  return rows.map((row)=>{
    const errors = [];
    const maNV = String(row.MaNV||'').trim();
    const emp = DB.employees.find(e=>e.maNV===maNV);
    if (!emp) errors.push('Mã NV không tồn tại');
    const dateStr = excelCellToDateStr(row.Ngay);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr) || !isRealCalendarDate(dateStr)) errors.push('Ngày không hợp lệ (cần yyyy-mm-dd, và phải là ngày có thật trên lịch)');
    const workingTeam = String(row.ToLamViec||'').trim();
    if (!DB.teams.some(t=>t.name===workingTeam)) errors.push('Tổ không tồn tại');
    if (emp && workingTeam && !getPermittedTeams(maNV).includes(workingTeam)) errors.push('Nhân viên không có quyền làm ở Tổ này');
    if (scope && workingTeam && workingTeam!==scope) errors.push('Ngoài phạm vi Tổ bạn quản lý');
    const loaiRaw = String(row.Loai||'').trim();
    const workType = loaiRaw==='GianTiep' ? 'Indirect' : (loaiRaw==='TrucTiep' ? 'Direct' : null);
    if (!workType) errors.push('Loai phải là TrucTiep hoặc GianTiep');
    const maTP = String(row.MaTP||'').trim();
    const maNVL = String(row.MaNVL||'').trim();
    const congDoan = String(row.CongDoan||'').trim();
    const sl = Number(row.SoLuong)||0;
    if (workType==='Direct'){
      if (!maTP) errors.push('Thiếu MaTP');
      if (!congDoan) errors.push('Thiếu CongDoan');
      if (!Number.isInteger(sl) || sl<0) errors.push('SoLuong phải là số nguyên ≥ 0');
    } else if (workType==='Indirect' && !congDoan){
      errors.push('Thiếu CongDoan (tên việc gián tiếp)');
    }
    const startStr = excelCellToHHMM(row.TGBatDau), endStr = excelCellToHHMM(row.TGKetThuc);
    let startMin=null, endMin=null;
    if (/^\d{1,2}:\d{2}$/.test(startStr)) startMin = hhmmToMin(startStr.length===4?'0'+startStr:startStr); else errors.push('Giờ bắt đầu không hợp lệ (cần HH:MM)');
    if (/^\d{1,2}:\d{2}$/.test(endStr)) endMin = hhmmToMin(endStr.length===4?'0'+endStr:endStr); else errors.push('Giờ kết thúc không hợp lệ (cần HH:MM)');

    let times=null, thoiGianChuan=0, needsStandardTime=false, overwriteId=null, tenTP='', tenNVL='';
    if (errors.length===0){
      times = computeTimes(startMin, endMin);
      if (times.insideBreak) errors.push('Nằm hoàn toàn trong giờ Break');
      if (times.actualTime<=0) errors.push('Actual Time = 0');
      if (times.totalTime > 960) errors.push('Tổng thời gian quá dài (>16h) — có thể sai Giờ bắt đầu/Kết thúc');
      if (workType==='Direct' && errors.length===0){
        const resolved = resolveStandardTime(maTP, workingTeam, congDoan, maNVL);
        if (resolved===null){ thoiGianChuan = 0; needsStandardTime = true; } // BR mới: khong chan import, luu tam =0, gan co canh bao
        else thoiGianChuan = resolved;
        const catRow = DB.workCatalog.find(c=> c.workType==='Direct' && c.maTP===maTP && c.workingTeam===workingTeam
          && c.congDoan===congDoan && (c.maNVL||'')===(maNVL||''));
        tenTP = catRow ? (catRow.tenTP||'') : '';
        tenNVL = catRow ? (catRow.tenNVL||'') : '';
      }
      if (errors.length===0){
        // Trung khop CHINH XAC (maNV+Ngay+Loai+MaTP+CongDoan+Bat dau+Ket thuc) -> coi la CAP NHAT (ghi de), khong bao loi Trung gio.
        const congDoanVal = congDoan;
        const existing = DB.workRecords.find(r=> r.maNV===maNV && r.date===dateStr && r.workType===workType
          && (r.maTP||'')===maTP && (r.workType==='Direct'?(r.congDoan||''):(r.indirectType||''))===congDoanVal
          && r.start===startMin && r.end===endMin);
        if (existing){
          overwriteId = existing.id;
        } else {
          const dbOverlap = overlapsExisting(maNV, dateStr, startMin, endMin, null);
          const key = maNV+'|'+dateStr;
          const batchList = batchByPerson[key]||[];
          const bEnd = endMin<=startMin?endMin+1440:endMin;
          const batchOverlap = batchList.some(x=> startMin < x.end && x.start < bEnd);
          if (dbOverlap || batchOverlap) errors.push('Trùng giờ với Work Record khác');
          else (batchByPerson[key]=batchList).push({start:startMin,end:bEnd});
        }
      }
    }
    return { maNV, ten: emp?emp.ten:'', employeeTeam: emp?(emp.employeeTeam||''):'', dateStr, workingTeam, workType, maTP, tenTP, maNVL, tenNVL, congDoan, sl, startMin, endMin, times, thoiGianChuan,
      needsStandardTime, overwriteId, note: String(row.GhiChu||'').trim(), errors };
  });
}
function parseWorkRecordImport(){
  const input = document.getElementById('importFileWR');
  if (!input || !input.files.length){ showToast('Chọn file trước.', true); return; }
  if (typeof XLSX==='undefined'){ showToast('Không tải được thư viện Excel (cần internet cho lần đầu).', true); return; }
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = (e)=>{
    const wb = XLSX.read(e.target.result, {type:'binary'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rawRows = XLSX.utils.sheet_to_json(ws, {defval:''});
    const validated = validateWorkRecordRows(rawRows);
    showWorkRecordPreviewModal(validated);
  };
  reader.readAsBinaryString(file);
}

    ${validated.map(v=>{

      else {

    <div class="modal-actions">
      <button class="btn btn-outline" data-action="closeModal">Đóng</button>
      ${ok.length? '<button class="btn btn-danger" id="confirmWRImport">Import dòng hợp lệ</button>' : ''}
    </div>`);
  if (ok.length){
    document.getElementById('confirmWRImport').addEventListener('click', async ()=>{
      if (document.getElementById('wrImportConfirmText').value.trim()!=='XÁC NHẬN'){ showToast('Chưa gõ đúng "XÁC NHẬN".', true); return; }
      await commitWorkRecordImport();

async function commitWorkRecordImport(){
  const validated = window._wrImportValidated || [];
  const ok = validated.filter(v=>v.errors.length===0);
  const u = currentUser();
  let createdCount=0, updatedCount=0, needsTGCCount=0;
  // Xay dung san danh sach ban ghi (kem id cho dong moi) — gui nguyen 1 lan len Server (bulkImportWorkRecords),
  // roi moi ap dung cung 1 danh sach nay vao DB cuc bo, tranh 2 nguon du lieu lech nhau.
  const itemsToSend = [];
  ok.forEach(v=>{
    if (v.needsStandardTime) needsTGCCount++;
    const fields = {
      maNV:v.maNV, ten:v.ten, employeeTeam:v.employeeTeam||'', workingTeam:v.workingTeam, date:v.dateStr, workType:v.workType,
      maTP: v.workType==='Direct'?v.maTP:null, tenTP: v.workType==='Direct'?(v.tenTP||''):'',
      congDoan: v.workType==='Direct'?v.congDoan:null,
      maNVL: v.workType==='Direct'?(v.maNVL||null):null, tenNVL: v.workType==='Direct'?(v.tenNVL||''):'',
      indirectType: v.workType==='Indirect'?v.congDoan:null,
      thoiGianChuan: v.workType==='Direct'?v.thoiGianChuan:0, quantity: v.workType==='Direct'?v.sl:0,
      start:v.startMin, end:v.endMin, totalTime:v.times.totalTime, breakTime:v.times.breakTime, actualTime:v.times.actualTime,
      note: v.note||'', needsStandardTime: !!v.needsStandardTime,
    };
    itemsToSend.push(v.overwriteId ? Object.assign({overwriteId:v.overwriteId}, fields) : Object.assign({id: uid()}, fields));
  });
  const apiResult = await apiCallOrQueue('bulkImportWorkRecords', { session: currentSession, records: itemsToSend });
  if (apiResult && !apiResult.ok){ showToast(apiResult.error||'Import Work Record thất bại.', true); return; }
  itemsToSend.forEach(item=>{
    if (item.overwriteId){
      const rec = DB.workRecords.find(r=>r.id===item.overwriteId);
      if (rec){
        const before = JSON.stringify(rec);
        Object.assign(rec, item, {status:'Pending', rejectReason:null});
        addAudit(rec.id, u.maNV, 'Cập nhật qua Import (ghi đè bản ghi trùng)', before, JSON.stringify(rec));
        updatedCount++;
      }
    } else {
      DB.workRecords.push(Object.assign({createdAt: Date.now(), status:'Pending'}, item));
      createdCount++;
    }
  });
  saveDB(); closeModal();
  let msg = `Đã import: ${createdCount} mới${updatedCount?`, ${updatedCount} cập nhật (ghi đè)`:''}.`;
  if (needsTGCCount) msg += ` ⚠️ ${needsTGCCount} dòng chưa có Thời gian chuẩn (tạm =0) — sẽ tự cập nhật khi Admin bổ sung định mức.`;
  showToast(msg);
  window._wrImportValidated=null; render();
}

function autoFillPendingStandardTimes(){
  const u = currentUser();

      const resolved = resolveStandardTime(r.maTP, r.workingTeam, r.congDoan, r.maNVL);

}

        DB.teams = apiResult.teams; saveDB(); showToast('Đã thêm Team (đồng bộ dùng chung).'); render(); return;
      }

    const maTP = loai==='Direct' ? val('addCatMaTP') : '';
    const tenTP = loai==='Direct' ? val('addCatTenTP') : '';
    const maNVL = loai==='Direct' ? val('addCatMaNVL') : '';
    const tenNVL = loai==='Direct' ? val('addCatTenNVL') : '';
    const tg = loai==='Direct' ? Number(val('addCatTGChuan'))||0 : 0;
    if (loai==='Direct' && !maTP){ showToast('Trực tiếp cần nhập Mã TP.', true); return; }
    const dup = DB.workCatalog.some(c=> c.workType===loai && c.workingTeam===to && (c.maTP||'')===maTP && (c.maNVL||'')===maNVL && c.congDoan===congDoan);
    if (dup){ showToast('Dòng này đã tồn tại (trùng khoá Loại+Tổ+Mã TP+Mã NVL+Công đoạn).', true); return; }
    const newItem = {workType:loai, workingTeam:to, maTP, tenTP, maNVL, tenNVL, congDoan, thoiGianChuan:tg};
    (async()=>{
      const apiResult = await apiCallOrQueue('addCatalog', { session: currentSession, item: newItem });
      if (apiResult){
        if (!apiResult.ok){ showToast(apiResult.error||'Thêm thất bại.', true); return; }
        DB.workCatalog = apiResult.catalog;
        const filled = autoFillPendingStandardTimes();
        saveDB(); showToast('Đã thêm (đồng bộ dùng chung).' + (filled? ` Đã tự động cập nhật TG chuẩn cho ${filled} Work Record đang chờ.` : '')); render();
        return;
      }
      DB.workCatalog.push(newItem); // fallback cuc bo neu chua co API dung chung
      const filled = autoFillPendingStandardTimes();
      saveDB(); showToast('Đã thêm.' + (filled? ` Đã tự động cập nhật TG chuẩn cho ${filled} Work Record đang chờ.` : '')); render();
    })();
    return;
  }
  if (type==='productstdtime'){
    const workingTeam = document.getElementById('addStdTo').value;
    const maTP = val('addStdMaTP');
    const tenTP = val('addStdTenTP');
    const tg = Number(val('addStdTG'))||0;
    if (!workingTeam || !maTP){ showToast('Nhập đủ Tổ và Mã TP.', true); return; }
    const newItem = {workingTeam, maTP, tenTP, standardTimeTotal: tg};
    (async()=>{
      const apiResult = await apiCallOrQueue('addProductStdTime', { session: currentSession, item: newItem });
      if (apiResult){
        if (!apiResult.ok){ showToast(apiResult.error||'Thêm thất bại.', true); return; }
        DB.productStandardTimes = apiResult.productStdTimes; saveDB(); showToast('Đã thêm (đồng bộ dùng chung).'); render();
        return;
      }
      const idx = DB.productStandardTimes.findIndex(p=>p.workingTeam===workingTeam && p.maTP===maTP);
      if (idx>=0) DB.productStandardTimes[idx] = newItem; else DB.productStandardTimes.push(newItem); // fallback cuc bo
      saveDB(); showToast('Đã thêm.'); render();
    })();
    return;
  }
}

/* Sửa thủ công 1 Nhân viên — mở modal, cho phép đổi Tên/Tổ chính/Role/Trạng thái/Mật khẩu. */
function editEmployee(maNV){
  const e = DB.employees.find(x=>x.maNV===maNV);
  if (!e) return;
  const teamOpts = DB.teams.map(t=>`<option value="${esc(t.name)}" ${t.name===e.employeeTeam?'selected':''}>${esc(t.name)}</option>`).join('');
  openModal(`<h3>Sửa Nhân viên — ${esc(maNV)}</h3>
    <div class="field"><label>Tên</label><input type="text" id="editEmpTen" value="${esc(e.ten)}"></div>
    <div class="row2">
      <div class="field"><label>Tổ (chính)</label><select id="editEmpTo">${teamOpts}</select></div>
      <div class="field"><label>Role</label><select id="editEmpRole">
        <option value="Employee" ${e.role==='Employee'?'selected':''}>Employee</option>
        <option value="Leader" ${e.role==='Leader'?'selected':''}>Leader</option>
        <option value="Admin" ${e.role==='Admin'?'selected':''}>Admin</option></select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Trạng thái</label><select id="editEmpTrangthai">
        <option value="Active" ${e.active?'selected':''}>Active</option>
        <option value="Inactive" ${!e.active?'selected':''}>Inactive</option></select></div>
      <div class="field"><label>Mật khẩu mới (để trống = giữ nguyên)</label><input type="text" id="editEmpPw"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" data-action="closeModal">Hủy</button>
      <button class="btn btn-primary" id="confirmEditEmp">Lưu thay đổi</button>
    </div>`);
  document.getElementById('confirmEditEmp').addEventListener('click', async ()=>{
    const homeTeam = document.getElementById('editEmpTo').value;
    const newRole = document.getElementById('editEmpRole').value;
    const newActive = document.getElementById('editEmpTrangthai').value==='Active';
    if (e.role==='Admin' && (newRole!=='Admin' || !newActive)){
      const otherActiveAdmins = DB.employees.filter(x=>x.maNV!==maNV && x.role==='Admin' && x.active).length;
      if (otherActiveAdmins===0){
        showToast('Đây là tài khoản Admin đang hoạt động duy nhất — không thể hạ quyền hoặc khoá, sẽ khiến không ai truy cập được Quản trị.', true);
        return;
      }
    }
    const newPw = document.getElementById('editEmpPw').value.trim();
    const changes = { ten: document.getElementById('editEmpTen').value.trim(), employeeTeam: homeTeam, role: newRole, active: newActive };
    if (newPw) changes.passwordHash = await sha256(newPw);
    const apiResult = await apiCallOrQueue('editEmployee', { session: currentSession, maNV, changes });
    if (apiResult){
      if (!apiResult.ok){ showToast(apiResult.error||'Sửa thất bại.', true); return; }
      DB.employees = apiResult.employees; saveDB(); closeModal(); showToast('Đã lưu thay đổi (đồng bộ dùng chung).'); render();
      return;
    }
    // fallback cuc bo neu chua co API dung chung
    Object.assign(e, changes);
    saveDB(); closeModal(); showToast('Đã lưu thay đổi.'); render();
  });
}

/* Xoá 1 Nhân viên — chặn xoá tài khoản Role=Admin. Xoá vĩnh viễn kèm quyền Working Team phụ của người đó. */
function deleteEmployee(maNV){
  const e = DB.employees.find(x=>x.maNV===maNV);
  if (!e) return;
  if (e.role==='Admin'){ showToast('Không được xoá tài khoản Admin.', true); return; }
  openModal(`<h3>Xoá Nhân viên — ${esc(maNV)}</h3>
    <div class="readout">${esc(e.ten)} · Tổ: ${esc(e.employeeTeam)||'—'} · Role: ${e.role}</div>
    <div class="banner">Xoá vĩnh viễn, không khôi phục được. Gõ <b>XOA</b> để xác nhận.</div>
    <div class="field" style="margin-top:10px;"><input type="text" id="deleteEmpConfirmText" placeholder="Gõ XOA"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" data-action="closeModal">Hủy</button>
      <button class="btn btn-danger" id="confirmDeleteEmp">Xoá vĩnh viễn</button>
    </div>`);
  document.getElementById('confirmDeleteEmp').addEventListener('click', async ()=>{
    if (document.getElementById('deleteEmpConfirmText').value.trim()!=='XOA'){ showToast('Chưa gõ đúng "XOA".', true); return; }
    const apiResult = await apiCallOrQueue('deleteEmployee', { session: currentSession, maNV });
    if (apiResult){
      if (!apiResult.ok){ showToast(apiResult.error||'Xoá thất bại.', true); return; }
      DB.employees = apiResult.employees;
      const ledTeams = DB.teams.filter(t=>t.leaderMaNV===maNV);
      ledTeams.forEach(t=> t.leaderMaNV='');
      saveDB(); closeModal();
      showToast(ledTeams.length? `Đã xoá nhân viên (đồng bộ dùng chung). ${ledTeams.length} Tổ (${ledTeams.map(t=>t.name).join(', ')}) hiện chưa có Leader.` : 'Đã xoá nhân viên (đồng bộ dùng chung).');
      render();
      return;
    }
    // fallback cuc bo neu chua co API dung chung
    DB.employees = DB.employees.filter(x=>x.maNV!==maNV);
    DB.workingTeamPermissions = DB.workingTeamPermissions.filter(p=>p.maNV!==maNV);
    const ledTeams = DB.teams.filter(t=>t.leaderMaNV===maNV);
    ledTeams.forEach(t=> t.leaderMaNV='');
    saveDB(); closeModal();
    showToast(ledTeams.length? `Đã xoá nhân viên. ${ledTeams.length} Tổ (${ledTeams.map(t=>t.name).join(', ')}) hiện chưa có Leader.` : 'Đã xoá nhân viên.');
    render();
  });
}


/* Sửa thủ công 1 Team — Tên Tổ là khóa chính (BR đã chốt), nên đổi tên phải cascade sang mọi chỗ
   đang lưu tên Tổ dưới dạng chuỗi: Employee.employeeTeam, workingTeamPermissions, Product.workingTeam,
   StandardTime.workingTeam, IndirectWorkTypes.workingTeam, và WorkRecord.workingTeam (kể cả lịch sử). */
function editTeam(oldName){
  const t = DB.teams.find(x=>x.name===oldName);
  if (!t) return;
  openModal(`<h3>Sửa Team — ${esc(oldName)}</h3>
    <div class="field"><label>Tên Tổ</label><input type="text" id="editTeamTento" value="${esc(t.name)}"></div>
    <div class="field"><label>Leader (Mã NV)</label><input type="text" id="editTeamLeaderto" value="${esc(t.leaderMaNV)}"></div>
    <div class="banner">Đổi Tên Tổ sẽ cập nhật lại tên này ở TOÀN BỘ dữ liệu liên quan (Nhân viên, Sản phẩm, Thời gian chuẩn, Việc gián tiếp, Quyền Working Team, và cả Work Record đã có).</div>
    <div class="modal-actions">
      <button class="btn btn-outline" data-action="closeModal">Hủy</button>
      <button class="btn btn-primary" id="confirmEditTeam">Lưu thay đổi</button>
    </div>`);
  document.getElementById('confirmEditTeam').addEventListener('click', async ()=>{
    const newName = document.getElementById('editTeamTento').value.trim();
    const newLeader = document.getElementById('editTeamLeaderto').value.trim();
    if (!newName){ showToast('Tên Tổ không được để trống.', true); return; }
    if (newName!==oldName && DB.teams.some(x=>x.name!==oldName && x.name===newName)){ showToast('Tên Tổ mới đã tồn tại.', true); return; }
    const apiResult = await apiCallOrQueue('editTeam', { session: currentSession, oldName, changes: { name:newName, leaderMaNV:newLeader } });
    if (apiResult && !apiResult.ok){ showToast(apiResult.error||'Sửa Tổ thất bại.', true); return; }
    if (apiResult && apiResult.ok) DB.teams = apiResult.teams;
    else { t.name = newName; t.leaderMaNV = newLeader; } // fallback cuc bo neu chua co API dung chung
    if (newName!==oldName){
      // Cascade sang du lieu VAN CON cuc bo trong Giai doan 1 (Catalog/Work Record) - lam o ca 2 truong hop API/local.
      if (!apiResult) DB.employees.forEach(e=>{ if (e.employeeTeam===oldName) e.employeeTeam=newName; }); // API da tu cascade Employees roi
      DB.workingTeamPermissions.forEach(p=>{ if (p.workingTeam===oldName) p.workingTeam=newName; });
      DB.workCatalog.forEach(c=>{ if (c.workingTeam===oldName) c.workingTeam=newName; });
      DB.workRecords.forEach(r=>{ if (r.workingTeam===oldName) r.workingTeam=newName; });
    }
    saveDB(); closeModal(); showToast(apiResult&&apiResult.ok ? 'Đã lưu thay đổi (đồng bộ dùng chung).' : 'Đã lưu thay đổi.'); render();
  });
}

/* Danh sách bảng gộp workCatalog — có tìm kiếm, lọc Tổ/Loại, sắp xếp, phân trang (BR UI-040b: cần khi dữ liệu lớn, đã áp dụng). */
function renderCatalogList(){
  let rows = DB.workCatalog.slice();
  const totalAll = rows.length;

  if (catalogFilterTo) rows = rows.filter(c=>c.workingTeam===catalogFilterTo);
  if (catalogFilterLoai) rows = rows.filter(c=>c.workType===catalogFilterLoai);
  if (catalogSearch){
    const q = catalogSearch.toLowerCase();
    rows = rows.filter(c=> (c.maTP||'').toLowerCase().includes(q) || (c.tenTP||'').toLowerCase().includes(q)
      || (c.congDoan||'').toLowerCase().includes(q) || (c.maNVL||'').toLowerCase().includes(q) || (c.tenNVL||'').toLowerCase().includes(q));
  }

  rows.sort((a,b)=>{
    const k = catalogSort.key;
    let av = a[k]||'', bv = b[k]||'';
    if (k==='thoiGianChuan') return catalogSort.dir*((av||0)-(bv||0));
    return catalogSort.dir*String(av).localeCompare(String(bv));
  });

  const totalFiltered = rows.length;
  const totalPages = Math.max(1, Math.ceil(totalFiltered/catalogPageSize));
  if (catalogPage > totalPages) catalogPage = totalPages;
  if (catalogPage < 1) catalogPage = 1;
  const startIdx = (catalogPage-1)*catalogPageSize;
  const pageRows = rows.slice(startIdx, startIdx+catalogPageSize);

  const teamOpts = DB.teams.map(t=>`<option value="${esc(t.name)}" ${catalogFilterTo===t.name?'selected':''}>${esc(t.name)}</option>`).join('');
  const th = (key,label)=> `<th data-action="catalogSort" data-val="${key}" class="${catalogSort.key===key?'sorted':''}">${label} ${catalogSort.key===key?(catalogSort.dir>0?'▲':'▼'):''}</th>`;

  return `
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="text" id="catalogSearchInput" placeholder="Tìm Mã TP / Tên TP / Công đoạn / NVL" value="${esc(catalogSearch)}">
      </div>
      <select id="catalogFilterToSelect"><option value="">Tất cả Tổ</option>${teamOpts}</select>
      <select id="catalogFilterLoaiSelect">
        <option value="">Tất cả loại</option>
        <option value="Direct" ${catalogFilterLoai==='Direct'?'selected':''}>Trực tiếp</option>
        <option value="Indirect" ${catalogFilterLoai==='Indirect'?'selected':''}>Gián tiếp</option>
      </select>
    </div>
    <div class="hint" style="margin-bottom:10px;">${totalFiltered} / ${totalAll} dòng ${(catalogSearch||catalogFilterTo||catalogFilterLoai)?'(đã lọc)':''}</div>
    <div class="tablewrap"><table><thead><tr>
      ${th('workType','Loại')}${th('workingTeam','Tổ')}${th('maTP','Mã TP')}${th('tenTP','Tên TP')}${th('maNVL','Mã NVL')}${th('tenNVL','Tên NVL')}${th('congDoan','Công đoạn')}${th('thoiGianChuan','TGC')}
    </tr></thead>
    <tbody>${pageRows.map(c=>`<tr>
      <td>${workTypeBadge(c.workType)}</td><td>${esc(c.workingTeam)}</td>
      <td>${esc(c.maTP)}</td><td>${esc(c.tenTP)}</td><td>${esc(c.maNVL)}</td><td>${esc(c.tenNVL)}</td>
      <td>${esc(c.congDoan)}</td><td>${c.workType==='Direct'?fmt3(c.thoiGianChuan):'—'}</td>
    </tr>`).join('')}</tbody></table></div>
    ${totalFiltered===0?'<div class="empty">Chưa có dữ liệu</div>':''}
    <div class="toolbar" style="margin-top:12px;justify-content:space-between;">
      <div style="display:flex;gap:8px;align-items:center;">
        <label style="margin:0;font-size:13px;">Số dòng/trang:</label>
        <select id="catalogPageSizeSelect">
          <option value="50" ${catalogPageSize===50?'selected':''}>50</option>
          <option value="100" ${catalogPageSize===100?'selected':''}>100</option>
          <option value="200" ${catalogPageSize===200?'selected':''}>200</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-outline btn-sm" data-action="catalogPrevPage" ${catalogPage<=1?'disabled':''}>← Trước</button>
        <span style="font-size:13px;color:var(--ink-soft);">Trang ${catalogPage}/${totalPages}</span>
        <button class="btn btn-outline btn-sm" data-action="catalogNextPage" ${catalogPage>=totalPages?'disabled':''}>Sau →</button>
      </div>
    </div>`;
}
